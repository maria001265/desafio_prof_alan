<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>

<!-- logo -->
<link rel="icon" type="image/png" href="favicon-32x32.png">
<!--link fonte red hat-->
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

<!--cores fundo-->
<style>
  :root{
    --blue-50: hsl(225, 100%, 98%);
    --roxo: hsl(245, 75%, 52%);
    --gray-600: hsl(224, 23%, 55%);
    --blue-950: hsl(223, 47%, 23%);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family: 'Red Hat Display', sans-serif;
    background-color: var(--blue-50);
    /* fundo mobile */
    background-image: url('pattern-background-mobile.svg');
    background-repeat: no-repeat;
    background-size: 100% auto;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  /*card principal ou hero*/

  .card{
    background: white;
    width: 100%;
    max-width: 350px;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    text-align: center;
  }

  .card-img img{
    width: 100%;
    display: block;
  }

  .conteudo{ padding: 25px; }

  h1{
    color: var(--blue-950);
    font-weight: 900;
    font-size: 22px;
    margin-bottom: 15px;
  }

  /* paragrafo */

  .descricao{
    color: var(--gray-600);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .plano{
    background-color: var(--blue-50);
    border-radius: 10px;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .plano-esquerda{
    display: flex;
    align-items: center;
    gap: 15px;
    text-align: left;
  }

  .plano-esquerda h3{
    font-size: 14px;
    font-weight: 900;
    color: var(--blue-950);
  }

  .plano-esquerda p{
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
  }

/*botões principais*/

  .btn-change{
    color: var(--roxo);
    font-size: 12px;
    font-weight: 700;
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }
  .btn-change:hover{ opacity: 0.7; text-decoration: none; }

  .btn-pagamento{
    width: 100%;
    background-color: var(--roxo);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(56, 42, 225, 0.3);
    margin-bottom: 20px;
  }
  .btn-pagamento:hover{ background-color: hsl(245, 75%, 65%); }

/*botão cancelar*/

  .btn-cancel{
    background: none;
    border: none;
    color: var(--gray-600);
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-cancel:hover{ color: var(--blue-950); }

  /* partes responsivas */
  @media (max-width: 375px){
    .card{ max-width: 320px; }
  }

  @media (min-width: 1440px){
    body{
      background-image: url('pattern-background-desktop.svg');
    }
    .card{ max-width: 400px; }
  }
</style>
</head>
<body>

<!-- div hero-->

<div class="card" id="card">
  <div class="card-img">
    <img src="illustration-hero.svg" alt="Pessoa ouvindo musica">
  </div>

<!--div descrição-->

  <div class="conteudo">
    <h1>Order Summary</h1>
    <p class="descricao">
      You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
    </p>

<!-- div planos-->

    <div class="plano">
      <div class="plano-esquerda">
        <img src="icon-music.svg" alt="icone musica">
        <div>
          <h3 id="nome-plano">Annual Plan</h3>
          <p id="preco-plano">$59.99/year</p>
        </div>
      </div>
      <button class="btn-change" onclick="mudarPlano()">Change</button>
    </div>

<!--div pagamento / cancelar-->

    <button class="btn-pagamento" onclick="pagar()">Proceed to Payment</button>
    <br>
    <button class="btn-cancel" onclick="cancelar()">Cancel Order</button>
  </div>
</div>

<script>
  // java
  let anual = true;

  function mudarPlano(){
    if(anual){
      document.getElementById("nome-plano").innerText = "Monthly Plan";
      document.getElementById("preco-plano").innerText = "$5.99/month";
      anual = false;
    } else {
      document.getElementById("nome-plano").innerText = "Annual Plan";
      document.getElementById("preco-plano").innerText = "$59.99/year";
      anual = true;
    }
  }

  function pagar(){
    alert("Pagamento confirmado!");
  }

  function cancelar(){
    if(confirm("Tem certeza que quer cancelar?")){
      document.getElementById("card").innerHTML = "<div style='padding:50px'><h1>Pedido Cancelado</h1><p style='font-size:16px; color:gray; margin-top:10px'>Seu pedido foi cancelado.</p></div>";
    }
  }
</script>

</body>
</html>
